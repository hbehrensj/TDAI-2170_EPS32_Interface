; PlatformIO project — TDAI-2170 ESP32-S2 WiFi-to-Serial interface
; Board: LOLIN/WeMos S2 Mini (ESP32-S2)

[platformio]
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
; Pinned: an unpinned "espressif32" resolved to a much newer major platform
; (55.3.39, a different underlying Arduino-ESP32/ESP-IDF generation) that no
; longer fits the 1.25MB OTA app partition. 7.0.1 is what CI actually built
; v1.5.6 with (currently running in the field) — pin to it so local and CI
; builds stay reproducible instead of silently drifting to whatever the
; registry resolves "espressif32" to on a given day.
platform = espressif32 @ 7.0.1
board = lolin_s2_mini
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Native USB CDC for Serial debug output on the S2 Mini
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0

lib_deps =
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0

; Over-the-air uploads:  pio run -e ota -t upload
; Inherits everything from the USB env; only overrides the upload transport.
[env:ota]
extends = env:lolin_s2_mini
upload_protocol = espota
upload_port = tdai2170.local
upload_flags =
    --auth=tdai2170-ota
